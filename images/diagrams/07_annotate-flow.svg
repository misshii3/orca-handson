<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 412" width="880" height="412" role="img" aria-labelledby="title desc">
  <title id="title">Annotate AI Diff の流れ</title>
  <desc id="desc">Changes タブの diff の複数行にノートを付け、ツールバーの Send を 1 回押すと、全ノートが File / Line / User comment の形の 1 つのプロンプトにまとまって Codex に届く。Codex が修正すると差分が更新され、Changes に反映される。1 件ずつ送るのではなく、まとめて 1 回送る。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#57606A"/>
    </marker>
  </defs>
  <!-- 背景カード -->
  <rect x="0.5" y="0.5" width="879" height="411" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" fill="#1F2328" font-size="13">
    <text x="24" y="40" font-size="20" font-weight="700">行にメモを付けて、まとめて 1 回で送る（Annotate AI Diff）</text>

    <!-- 左: Changes タブの diff -->
    <rect x="24" y="64" width="340" height="236" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
    <text x="36" y="82" font-size="12" font-weight="600">Changes</text>
    <rect x="228" y="69" width="64" height="18" rx="999" fill="#F6F8FA" stroke="#D0D7DE"/>
    <text x="260" y="82" font-size="11" text-anchor="middle">AI メモ 2</text>
    <rect x="300" y="69" width="52" height="18" rx="999" fill="#1F2328"/>
    <text x="326" y="82" font-size="11" font-weight="600" text-anchor="middle" fill="#FFFFFF">Send</text>
    <line x1="36" y1="92" x2="352" y2="92" stroke="#D0D7DE"/>
    <text x="36" y="106" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">src/date.js <tspan fill="#1A7F37">+2</tspan> <tspan fill="#CF222E">-2</tspan></text>
    <!-- diff 4 行 -->
    <g font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <rect x="36" y="112" width="316" height="18" fill="#FFEBE9"/>
      <text x="56" y="125" fill="#CF222E">−</text>
      <text x="80" y="125">const month = date.getMonth();</text>
      <rect x="36" y="132" width="316" height="18" fill="#FFEBE9"/>
      <text x="56" y="145" fill="#CF222E">−</text>
      <text x="80" y="145">const day = date.getDate();</text>
      <rect x="36" y="152" width="316" height="18" fill="#DAFBE1"/>
      <rect x="40" y="155" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#1F2328"/>
      <text x="46" y="164.5" text-anchor="middle" font-weight="700">+</text>
      <text x="56" y="165" fill="#1A7F37">16+</text>
      <text x="80" y="165">const month = String(date.getMonth() + 1)…</text>
      <rect x="36" y="224" width="316" height="18" fill="#DAFBE1"/>
      <rect x="40" y="227" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#1F2328"/>
      <text x="46" y="236.5" text-anchor="middle" font-weight="700">+</text>
      <text x="56" y="237" fill="#1A7F37">17+</text>
      <text x="80" y="237">const day = String(date.getDate())…</text>
    </g>
    <!-- ノート 1 -->
    <rect x="72" y="176" width="280" height="42" rx="8" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.25"/>
    <rect x="80" y="182" width="52" height="16" rx="999" fill="#1F2328"/>
    <text x="106" y="194" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">ノート 1</text>
    <text x="140" y="194" font-size="11" fill="#57606A">16 行目 / Add note for the AI</text>
    <text x="80" y="211" font-size="12">なぜ getMonth() に +1 が必要なのか、…</text>
    <!-- ノート 2 -->
    <rect x="72" y="248" width="280" height="42" rx="8" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.25"/>
    <rect x="80" y="254" width="52" height="16" rx="999" fill="#1F2328"/>
    <text x="106" y="266" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">ノート 2</text>
    <text x="140" y="266" font-size="11" fill="#57606A">17 行目 / Add note for the AI</text>
    <text x="80" y="283" font-size="12">padStart(2, "0") の意図も一言で</text>

    <!-- Send の矢印（ツールバーの Send から 1 本だけ） -->
    <line x1="356" y1="78" x2="442" y2="78" stroke="#57606A" stroke-width="1.75" marker-end="url(#arrow)"/>
    <text x="404" y="96" font-size="11" text-anchor="middle" fill="#57606A">まとめて 1 回</text>

    <!-- 中央: 1 つのプロンプト -->
    <rect x="444" y="64" width="224" height="236" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
    <text x="456" y="85" font-weight="600">1 つのプロンプトにまとまる</text>
    <rect x="456" y="96" width="200" height="192" rx="8" fill="#F6F8FA"/>
    <g font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="466" y="114"><tspan fill="#57606A">File:</tspan> src/date.js</text>
      <text x="466" y="129"><tspan fill="#57606A">Line:</tspan> 16</text>
      <text x="466" y="144" fill="#57606A">User comment:</text>
      <text x="466" y="159">"なぜ getMonth() に +1 が</text>
      <text x="466" y="174">必要なのか、…"</text>
      <line x1="466" y1="184" x2="646" y2="184" stroke="#D0D7DE"/>
      <text x="466" y="203"><tspan fill="#57606A">File:</tspan> src/date.js</text>
      <text x="466" y="218"><tspan fill="#57606A">Line:</tspan> 17</text>
      <text x="466" y="233" fill="#57606A">User comment:</text>
      <text x="466" y="248">"padStart(2, "0") の意図も</text>
      <text x="466" y="263">一言で"</text>
    </g>

    <!-- プロンプト → Codex -->
    <line x1="676" y1="182" x2="734" y2="182" stroke="#57606A" stroke-width="1.75" marker-end="url(#arrow)"/>
    <rect x="736" y="140" width="120" height="84" rx="8" fill="#DDF4FF" stroke="#0969DA" stroke-width="1.5"/>
    <text x="796" y="168" font-size="15" font-weight="600" text-anchor="middle">Codex</text>
    <text x="796" y="192" font-size="12" text-anchor="middle">ノートを読んで</text>
    <text x="796" y="210" font-size="12" text-anchor="middle">コードを修正</text>

    <!-- 戻り矢印: 差分が更新 → Changes に反映 -->
    <path d="M796 224V332H194V302" fill="none" stroke="#57606A" stroke-width="1.75" marker-end="url(#arrow)"/>
    <text x="495" y="322" text-anchor="middle">差分が更新 → Changes に反映</text>

    <!-- 下帯: 1 件ずつではなく、まとめて -->
    <rect x="24" y="348" width="832" height="40" rx="8" fill="#F6F8FA" stroke="#D0D7DE"/>
    <text x="40" y="373" fill="#57606A">1 件ずつ送る</text>
    <line x1="38" y1="369" x2="118" y2="369" stroke="#CF222E" stroke-width="1.5"/>
    <text x="130" y="373">→ 気になる行すべてにノートを付けてから <tspan font-weight="700">Send</tspan> を 1 回。エージェントが全体を見て一貫した修正をする</text>
  </g>
</svg>
