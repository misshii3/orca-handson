<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 556" width="880" height="556" role="img" aria-labelledby="title desc">
  <title id="title">Orca のウィンドウ構成</title>
  <desc id="desc">Orca の画面を模式的に示した図。左サイドバー（プロジェクトとワークツリー）、中央（タブとペイン）、右パネル（ファイル / Agent セッション履歴 / Source Control / PR の 4 タブ）、下のステータスバー（Claude・Codex の使用量）、左下の設定（歯車、⌘,）、右上の右パネル開閉ボタンに ①〜⑥ の番号を付けている。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#57606A"/>
    </marker>
    <clipPath id="win">
      <rect x="24" y="60" width="832" height="376" rx="12"/>
    </clipPath>
  </defs>
  <!-- 背景カード -->
  <rect x="0.5" y="0.5" width="879" height="555" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" fill="#1F2328" font-size="13">
    <text x="24" y="40" font-size="20" font-weight="700">Orca のウィンドウ構成</text>
    <text x="856" y="40" text-anchor="end" font-size="12" fill="#57606A">番号は 02 章「画面の見方」の箇条書きと対応</text>

    <!-- ウィンドウ枠（角丸でクリップした背景） -->
    <g clip-path="url(#win)">
      <rect x="24" y="60" width="832" height="376" fill="#FFFFFF"/>
      <rect x="24" y="60" width="832" height="28" fill="#F6F8FA"/>
      <rect x="24" y="88" width="196" height="324" fill="#F6F8FA"/>
      <rect x="220" y="88" width="300" height="26" fill="#F6F8FA"/>
      <rect x="24" y="412" width="832" height="24" fill="#F6F8FA"/>
    </g>
    <rect x="24" y="60" width="832" height="376" rx="12" fill="none" stroke="#D0D7DE" stroke-width="1.5"/>
    <line x1="24" y1="88" x2="856" y2="88" stroke="#D0D7DE"/>
    <line x1="220" y1="88" x2="220" y2="412" stroke="#D0D7DE"/>
    <line x1="520" y1="88" x2="520" y2="412" stroke="#D0D7DE"/>
    <line x1="220" y1="114" x2="520" y2="114" stroke="#D0D7DE"/>
    <line x1="520" y1="116" x2="856" y2="116" stroke="#D0D7DE"/>
    <line x1="24" y1="412" x2="856" y2="412" stroke="#D0D7DE"/>

    <!-- タイトルバー: 信号機・アプリ名・右パネル開閉（⑥） -->
    <circle cx="40" cy="74" r="5" fill="#D0D7DE"/>
    <circle cx="56" cy="74" r="5" fill="#D0D7DE"/>
    <circle cx="72" cy="74" r="5" fill="#D0D7DE"/>
    <text x="88" y="78" font-size="12" font-weight="600">Orca</text>
    <text x="712" y="78" font-size="11" fill="#57606A">▷ コマンド</text>
    <rect x="826" y="68" width="16" height="12" rx="2" fill="none" stroke="#1F2328" stroke-width="1.5"/>
    <line x1="836" y1="68" x2="836" y2="80" stroke="#1F2328" stroke-width="1.5"/>

    <!-- ① 左サイドバー -->
    <rect x="34" y="96" width="146" height="18" rx="6" fill="#FFFFFF" stroke="#D0D7DE"/>
    <text x="42" y="109" font-size="11" fill="#57606A">検索</text>
    <g font-size="11" fill="#57606A">
      <text x="36" y="132">○ オンボーディングチェックリスト</text>
      <text x="36" y="150">☰ タスク</text>
      <text x="36" y="168">◷ 自動化</text>
      <text x="36" y="186">▯ Orca モバイル</text>
    </g>
    <text x="34" y="212" font-size="12" fill="#57606A">プロジェクト</text>
    <text x="34" y="234" font-weight="600">▾ orca-handson</text>
    <circle cx="42" cy="252" r="3.5" fill="#D0D7DE"/>
    <text x="52" y="256">main</text>
    <rect x="86" y="244" width="60" height="16" rx="999" fill="#FFFFFF" stroke="#D0D7DE"/>
    <text x="116" y="256" font-size="11" text-anchor="middle" fill="#57606A">プライマリ</text>
    <circle cx="42" cy="278" r="3.5" fill="#D97757"/>
    <text x="52" y="282">fix-tests-claude <tspan fill="#1A7F37" font-weight="700">✓</tspan></text>
    <text x="52" y="297" font-size="11" fill="#57606A">&lt;ID&gt;/fix-tests-claude</text>
    <circle cx="42" cy="318" r="3.5" fill="#0969DA"/>
    <text x="52" y="322">fix-tests-codex <tspan fill="#57606A" font-weight="700">⟳</tspan></text>
    <text x="52" y="337" font-size="11" fill="#57606A">&lt;ID&gt;/fix-tests-codex</text>
    <!-- ⑤ 左下の歯車 -->
    <circle cx="42" cy="396" r="6" fill="none" stroke="#1F2328" stroke-width="2.5" stroke-dasharray="2.8 1.9"/>
    <circle cx="42" cy="396" r="2.2" fill="#1F2328"/>
    <text x="56" y="400" font-size="12">設定 ⌘,</text>

    <!-- ② 中央: タブとペイン -->
    <rect x="228" y="92" width="76" height="22" rx="6" fill="#FFFFFF" stroke="#D0D7DE"/>
    <text x="266" y="107" font-size="12" text-anchor="middle">ターミナル</text>
    <text x="316" y="107" font-size="12" fill="#57606A">Changes</text>
    <text x="380" y="108" font-size="13" fill="#57606A">+</text>
    <!-- ペイン 1: Claude Code -->
    <rect x="228" y="124" width="136" height="258" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
    <rect x="236" y="132" width="88" height="18" rx="999" fill="#FFF1E5" stroke="#D97757"/>
    <text x="280" y="145" font-size="11" text-anchor="middle">Claude Code</text>
    <rect x="236" y="164" width="104" height="4" rx="2" fill="#D0D7DE"/>
    <rect x="236" y="176" width="72" height="4" rx="2" fill="#D0D7DE"/>
    <rect x="236" y="188" width="116" height="4" rx="2" fill="#D0D7DE"/>
    <rect x="236" y="200" width="56" height="4" rx="2" fill="#D0D7DE"/>
    <rect x="236" y="212" width="96" height="4" rx="2" fill="#D0D7DE"/>
    <rect x="236" y="356" width="120" height="16" rx="4" fill="#F6F8FA" stroke="#D0D7DE"/>
    <text x="242" y="368" font-size="11" fill="#57606A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&gt;</text>
    <!-- ペイン 2: Codex -->
    <rect x="372" y="124" width="136" height="258" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
    <rect x="380" y="132" width="56" height="18" rx="999" fill="#DDF4FF" stroke="#0969DA"/>
    <text x="408" y="145" font-size="11" text-anchor="middle">Codex</text>
    <rect x="380" y="164" width="88" height="4" rx="2" fill="#D0D7DE"/>
    <rect x="380" y="176" width="112" height="4" rx="2" fill="#D0D7DE"/>
    <rect x="380" y="188" width="64" height="4" rx="2" fill="#D0D7DE"/>
    <rect x="380" y="200" width="104" height="4" rx="2" fill="#D0D7DE"/>
    <rect x="380" y="212" width="80" height="4" rx="2" fill="#D0D7DE"/>
    <rect x="380" y="356" width="120" height="16" rx="4" fill="#F6F8FA" stroke="#D0D7DE"/>
    <text x="386" y="368" font-size="11" fill="#57606A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&gt;</text>
    <text x="370" y="401" font-size="12" text-anchor="middle" fill="#57606A">左右に分割して 2 つのエージェントを並べる</text>

    <!-- ③ 右パネル: 4 アイコン -->
    <g fill="none" stroke="#57606A" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
      <!-- ファイル -->
      <path d="M539 95h6.5l4.5 4.5V109a1 1 0 0 1-1 1h-10a1 1 0 0 1-1-1V96a1 1 0 0 1 1-1z"/>
      <path d="M545.5 95v4.5h4.5"/>
      <!-- Agent セッション履歴 -->
      <rect x="569" y="95" width="6" height="6" rx="1"/>
      <rect x="577" y="95" width="6" height="6" rx="1"/>
      <rect x="569" y="103" width="6" height="6" rx="1"/>
      <rect x="577" y="103" width="6" height="6" rx="1"/>
    </g>
    <!-- Source Control（強調） -->
    <rect x="596" y="90" width="24" height="24" rx="6" fill="#F6F8FA" stroke="#1F2328" stroke-width="1.5"/>
    <g fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round">
      <circle cx="603" cy="96" r="2.5"/>
      <circle cx="603" cy="108" r="2.5"/>
      <circle cx="613" cy="98" r="2.5"/>
      <line x1="603" y1="98.5" x2="603" y2="105.5"/>
      <path d="M613 100.5c0 4.5-10 1.5-10 5"/>
    </g>
    <rect x="596" y="114" width="24" height="2" fill="#1F2328"/>
    <!-- PR -->
    <g fill="none" stroke="#57606A" stroke-width="1.5" stroke-linecap="round">
      <circle cx="635" cy="96" r="2.5"/>
      <circle cx="635" cy="108" r="2.5"/>
      <line x1="635" y1="98.5" x2="635" y2="105.5"/>
      <circle cx="645" cy="108" r="2.5"/>
      <line x1="645" y1="105.5" x2="645" y2="99"/>
      <path d="M642 101.5l3-3 3 3"/>
    </g>
    <!-- Source Control のツールチップ -->
    <path d="M604 122l4-5 4 5z" fill="#1F2328"/>
    <rect x="566" y="121" width="100" height="18" rx="4" fill="#1F2328"/>
    <text x="616" y="134" font-size="11" text-anchor="middle" fill="#FFFFFF">Source Control</text>

    <!-- Source Control 本体 -->
    <rect x="528" y="148" width="84" height="22" rx="6" fill="#F6F8FA" stroke="#D0D7DE"/>
    <text x="570" y="163" font-size="12" text-anchor="middle">PR を作成</text>
    <text x="528" y="186" font-size="11" fill="#57606A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&lt;ID&gt;/fix-tests-claude → origin/main</text>
    <rect x="528" y="196" width="320" height="34" rx="6" fill="#FFFFFF" stroke="#D0D7DE"/>
    <text x="538" y="217" font-size="12" fill="#57606A">メッセージ</text>
    <rect x="528" y="238" width="320" height="22" rx="6" fill="#F6F8FA" stroke="#D0D7DE"/>
    <text x="688" y="253" font-size="12" text-anchor="middle">＋ ステージオール</text>
    <rect x="528" y="270" width="320" height="22" rx="6" fill="#F6F8FA"/>
    <text x="538" y="285" font-size="12" font-weight="600">▾ 変更点 2</text>
    <text x="838" y="285" font-size="11" text-anchor="end" fill="#57606A">すべて見る</text>
    <g font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <rect x="536" y="300" width="8" height="10" rx="1" fill="none" stroke="#57606A"/>
      <text x="550" y="309">date.js <tspan fill="#57606A">src</tspan></text>
      <text x="790" y="309" text-anchor="end" fill="#1A7F37">+2</text>
      <text x="812" y="309" text-anchor="end" fill="#CF222E">-2</text>
      <text x="838" y="309" text-anchor="end" fill="#BF8700">M</text>
      <rect x="536" y="322" width="8" height="10" rx="1" fill="none" stroke="#57606A"/>
      <text x="550" y="331">price.js <tspan fill="#57606A">src</tspan></text>
      <text x="790" y="331" text-anchor="end" fill="#1A7F37">+2</text>
      <text x="812" y="331" text-anchor="end" fill="#CF222E">-2</text>
      <text x="838" y="331" text-anchor="end" fill="#BF8700">M</text>
    </g>
    <text x="528" y="402" font-size="12">▸ コミット</text>

    <!-- ④ ステータスバー -->
    <circle cx="38" cy="424" r="4" fill="#D97757"/>
    <text x="48" y="428" font-size="11">Claude 19% 使用済み · 3h 45m</text>
    <circle cx="262" cy="424" r="4" fill="#0969DA"/>
    <text x="272" y="428" font-size="11">Codex 5% 使用済み · 4h 57m</text>

    <!-- 番号バッジ -->
    <g font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">
      <circle cx="208" cy="100" r="10" fill="#1F2328"/>
      <text x="208" y="104.5">1</text>
      <circle cx="506" cy="101" r="10" fill="#1F2328"/>
      <text x="506" y="105.5">2</text>
      <circle cx="840" cy="102" r="10" fill="#1F2328"/>
      <text x="840" y="106.5">3</text>
      <circle cx="486" cy="424" r="10" fill="#1F2328"/>
      <text x="486" y="428.5">4</text>
      <circle cx="122" cy="396" r="10" fill="#1F2328"/>
      <text x="122" y="400.5">5</text>
      <circle cx="806" cy="74" r="10" fill="#1F2328"/>
      <text x="806" y="78.5">6</text>
    </g>

    <!-- 凡例 -->
    <line x1="24" y1="448" x2="856" y2="448" stroke="#D0D7DE"/>
    <text x="32" y="470">① 左サイドバー（プロジェクトとワークツリー）</text>
    <text x="456" y="470">② 中央（タブとペイン）</text>
    <text x="32" y="496">③ 右パネル（4 タブ: ファイル / Agent セッション履歴<tspan x="52" dy="1.4em">/ Source Control / PR）</tspan></text>
    <text x="456" y="496">④ ステータスバー（Claude・Codex の使用量）</text>
    <text x="32" y="538">⑤ 設定（左下の歯車、⌘,）</text>
    <text x="456" y="538">⑥ 右パネルの開閉（右上）</text>
  </g>
</svg>
